<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Painel Vila Aurora</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main><header><h1>Painel Vila Aurora</h1><p>Usuário: {{ user }} | Perfil: {{ role }} | <a href="/logout">Sair</a></p></header><section aria-labelledby="eventos"><h2 id="eventos">Últimos eventos</h2><div class="tablewrap"><table><thead><tr><th>Horário UTC</th><th>ID</th><th>Dados</th></tr></thead><tbody>{% for e in eventos %}<tr><td>{{ e.ts }}</td><td>{{ e.id }}</td><td><pre>{{ e.payload }}</pre></td></tr>{% else %}<tr><td colspan="3">Nenhum evento recebido.</td></tr>{% endfor %}</tbody></table></div></section></main></body></html>
